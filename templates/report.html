{% extends 'base.html' %}
{% block content %}
<h3>Balance Report</h3>
<p class="text-muted">Grid view: Product | Warehouse | Qty</p>
<table class="table table-sm table-striped">
  <thead><tr><th>Product</th><th>Warehouse</th><th>Qty</th></tr></thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td>{{ r.product_name }} ({{ r.product_id }})</td>
      <td>{{ r.location_name }} ({{ r.location_id }})</td>
      <td>{{ r.qty }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
